name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-django

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  assets:
    name: Assets (Tailwind, i18n)
    runs-on: ubuntu-24.04
    needs: [lint]
    permissions:
      contents: read

    # Same settings and build steps as Render: production storage (manifest +
    # WhiteNoise) fails collectstatic if the compiled CSS is missing.
    # SECRET_KEY comes from setup-django (random per run).
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      ALLOWED_HOSTS: localhost
      DATABASE_URL: sqlite:////tmp/ci-build.sqlite3

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-django

      - name: Install production dependencies
        run: pip install -r requirements/production.txt

      - name: Build Tailwind CSS and collect static files
        run: |
          python manage.py tailwind build
          python manage.py collectstatic --noinput
          test -s staticfiles/css/tailwind.css
          ls staticfiles/vendor/htmx-*.min.js

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      # The .po/.mo files are committed because Render has no gettext; fail
      # if they are stale. POT-Creation-Date changes on every run, so it is
      # ignored.
      - name: Translations are up to date
        run: |
          python manage.py makemessages -l es --no-location --no-obsolete
          python manage.py compilemessages -l es --ignore=.venv
          git diff --exit-code -I '^"POT-Creation-Date: ' -- locale/

  # Production runs this image (render.yaml, `medbook-demo`): a PR that breaks
  # the Dockerfile fails here instead of in Render's build. Nothing is pushed.
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [lint]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    needs: [lint]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medbook_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_CI_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # SECRET_KEY comes from setup-django (random per run).
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:${{ secrets.POSTGRES_CI_PASSWORD }}@localhost:5432/medbook_test

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-django

      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          pytest \
            --cov-report=xml \
            --tb=short \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
