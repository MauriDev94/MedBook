{% load i18n %}
{# One submit button per language: works without JavaScript. #}
<form action="{% url 'set_language' %}" method="post" class="flex items-center gap-1" aria-label="{% translate 'Language' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for code, name in LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}" lang="{{ code }}" title="{{ name }}"
            {% if code == LANGUAGE_CODE %}aria-current="true"{% endif %}
            class="rounded px-2 py-1 text-xs font-semibold uppercase {% if code == LANGUAGE_CODE %}bg-teal-700 text-white{% else %}text-slate-600 hover:bg-slate-100{% endif %}">{{ code }}</button>
  {% endfor %}
</form>
