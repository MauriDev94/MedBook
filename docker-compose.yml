services:
  db:
    image: postgres:16-alpine
    container_name: medbook-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbook}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default on purpose: it comes from your untracked .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - medbook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The production image, booted the way Render boots it: the image's CMD
  # (scripts/start-production.sh) with production settings and PORT=10000.
  # Behind a profile, so `docker compose up` starts only the database; try the
  # image with `docker compose up --build web`. Development uses runserver.
  web:
    profiles: ["image"]
    build: .
    container_name: medbook-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:10000"
    environment:
      # Same non-secret values as render.yaml; only the hosts are local.
      # Production settings redirect plain HTTP to HTTPS (except /health/),
      # so send `X-Forwarded-Proto: https` like Render's proxy does.
      DJANGO_SETTINGS_MODULE: config.settings.production
      PORT: "10000"
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      MEDBOOK_DEMO_DATA: "true"
      # Secrets come from your untracked .env (see .env.example); `:?` makes
      # compose stop and name any missing one. Nothing secret is written here.
      SECRET_KEY: ${SECRET_KEY:?}
      # host = "db" (the compose service name), port = 5432 (Postgres'
      # container-internal port, not the 5435 host-mapped port above).
      # No password in the URL: libpq (psycopg2) reads it from PGPASSWORD.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}@db:5432/${POSTGRES_DB:-medbook}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}

volumes:
  medbook_pgdata:
