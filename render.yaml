# Render Blueprint de MedBook: fuente de verdad del servicio de producción.
#
# El servicio está gestionado por un Blueprint con auto-sync: todo cambio a
# este archivo que llega a `master` se aplica solo en Render. No editar
# estos campos en el dashboard; cambiarlos aquí con un PR.
#
# Secretos: nunca llevan valor aquí, así el Blueprint nunca los sobrescribe.
# Viven solo en el dashboard (Environment): SECRET_KEY, DATABASE_URL,
# DJANGO_SUPERUSER_EMAIL, DJANGO_SUPERUSER_PASSWORD.
#
# Paso 32 (#145): producción corre la imagen Docker Alpine del Dockerfile.
# Render no cambia el runtime de un servicio, así que la imagen llegó en un
# servicio nuevo (`medbook-demo`) y el nativo (`MedBook`) se retiró: salió
# de este archivo y se borró a mano, porque un Blueprint nunca borra.
services:
  - type: web
    name: medbook-demo
    runtime: docker
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /health/
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Sin dockerCommand: arranca con el CMD de la imagen,
    # scripts/start-production.sh (migrate, ensure_superuser, seed_demo,
    # generate_slots --days=28 y gunicorn en $PORT). Así render.yaml y la
    # imagen no pueden contradecirse. El build (Tailwind y collectstatic)
    # también está en el Dockerfile.

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      # Solo el host del servicio. Los health checks de Render también lo
      # mandan como Host; con un dominio propio verificado mandarían ese
      # dominio, que habría que agregar aquí.
      - key: ALLOWED_HOSTS
        value: medbook-demo.onrender.com

      - key: DEFAULT_FROM_EMAIL
        value: "MedBook <noreply@medbook.com>"

      # Emails van a los logs de Render — sin envío real (Paso 38, #164)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

      # Producción es la demo del portfolio: seed_demo crea los doctores demo
      # (apps/doctors/demo.py, sin contraseña utilizable). No es secreta.
      - key: MEDBOOK_DEMO_DATA
        value: "true"

      # Secretos sin valor. Render solo pide los `sync: false` al crear un
      # Blueprint, no al agregarle un servicio: en este servicio se
      # ingresaron a mano en el dashboard.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
