# Render Blueprint de MedBook: fuente de verdad del servicio de producción.
#
# El servicio está gestionado por un Blueprint con auto-sync: todo cambio a
# este archivo que llega a `master` se aplica solo en Render. No editar estos
# campos en el dashboard; cambiarlos aquí con un PR.
#
# Secretos: NO se declaran aquí, así el Blueprint nunca los sobrescribe. Viven
# solo en el dashboard (Environment): SECRET_KEY, DATABASE_URL,
# DJANGO_SUPERUSER_EMAIL, DJANGO_SUPERUSER_PASSWORD.
#
# Python: lo define `.python-version` (major.minor → Render usa el último
# parche). No usar la variable PYTHON_VERSION, que exige versión completa y
# tiene prioridad sobre el archivo.
services:
  - type: web
    # Debe coincidir con el nombre del servicio existente: así el Blueprint
    # lo adopta en vez de crear uno nuevo (misma URL y mismos secretos).
    name: MedBook
    runtime: python
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /health/

    # `tailwind build` descarga el CLI de Tailwind (versión fijada en
    # TAILWIND_CLI_VERSION) y compila static/css/tailwind.css. Va antes de
    # collectstatic, cuyo manifest necesita el CSS. Las traducciones no se
    # compilan aquí: los .mo están versionados (Render no tiene gettext).
    buildCommand: >-
      pip install -r requirements/production.txt &&
      python manage.py tailwind build &&
      python manage.py collectstatic --noinput

    # Slots se (re)generan en cada arranque: el plan free no tiene cron jobs,
    # pero la instancia duerme tras 15 min sin tráfico y arranca en el
    # siguiente request y en cada deploy. generate_slots es idempotente.
    # Antes, seed_demo crea los doctores demo que falten (MEDBOOK_DEMO_DATA),
    # también idempotente. Los dos van en un subshell: si fallan solo dejan
    # un WARNING y gunicorn arranca igual (migrate y ensure_superuser sí
    # siguen bloqueando el arranque).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      (python manage.py seed_demo ||
      echo "WARNING: seed_demo failed, starting without demo data") &&
      (python manage.py generate_slots --days=28 ||
      echo "WARNING: generate_slots failed, starting without new slots") &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 120

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      # Cualquier subdominio de Render; se ajusta al host exacto en el Paso 32
      # (migración a Docker, que trae URL nueva).
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: DEFAULT_FROM_EMAIL
        value: "MedBook <noreply@medbook.com>"

      # Emails van a los logs de Render — sin SMTP real
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

      # Producción es la demo del portfolio: seed_demo crea los doctores demo
      # (apps/doctors/demo.py, sin contraseña utilizable). No es secreta.
      - key: MEDBOOK_DEMO_DATA
        value: "true"
